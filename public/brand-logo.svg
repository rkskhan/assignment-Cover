<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Border Metallic Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.7" />
    </linearGradient>

    <!-- Left Stem of 'A' Gradient (Rich Indigo-Navy) -->
    <linearGradient id="stemLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Right Stem of 'A' Gradient (Brilliant Indigo-Violet) -->
    <linearGradient id="stemRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Golden Crossbar / Academic Bookmark Ribbon -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Golden Tassel & Cap Accent -->
    <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Deep Shadow for Dimensional Depth -->
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Squircle Shield Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- 2. The Monogram "A" with Academic Architecture -->
  <g filter="url(#letterShadow)">
    <!-- Left Leg of "A" -->
    <path d="M 52 28 L 60 28 L 47 67 L 33 67 Z" fill="url(#stemLeftGrad)" />
    <path d="M 47 67 L 33 67 L 23 95 L 39 95 L 48 71 Z" fill="url(#stemLeftGrad)" />
    <!-- Left Base Serif -->
    <rect x="20" y="93" width="22" height="3" rx="1.5" fill="url(#stemLeftGrad)" />

    <!-- Right Leg of "A" -->
    <path d="M 60 28 L 68 28 L 87 67 L 73 67 Z" fill="url(#stemRightGrad)" />
    <path d="M 73 67 L 87 67 L 97 95 L 81 95 L 72 71 Z" fill="url(#stemRightGrad)" />
    <!-- Right Base Serif -->
    <rect x="78" y="93" width="22" height="3" rx="1.5" fill="url(#stemRightGrad)" />

    <!-- Apex Crown of "A" (Academic Mortarboard integration) -->
    <!-- Mortarboard Diamond Diamond Top -->
    <polygon points="60,17 77,24 60,31 43,24" fill="#1E1B4B" stroke="url(#goldCapGrad)" stroke-width="1.4" stroke-linejoin="round" />
    
    <!-- Cap Center Button -->
    <circle cx="60" cy="24" r="2.2" fill="url(#goldCapGrad)" />
    
    <!-- Golden Hanging Tassel to Right -->
    <path d="M 60 24 Q 74 25 76 33 L 78 41" fill="none" stroke="url(#goldCapGrad)" stroke-width="1.6" stroke-linecap="round" />
    <polygon points="76,41 80,41 78.5,46 77.5,46" fill="url(#goldCapGrad)" />

    <!-- Golden Academic Crossbar (Sleek Folded Ribbon with V-notch) -->
    <g>
      <!-- Main Ribbon Bar across A -->
      <path d="M 33 65 L 87 65 L 84 75 L 36 75 Z" fill="url(#goldRibbon)" />
      
      <!-- Folded Ribbon Under-flaps for 3D depth -->
      <path d="M 33 65 L 36 75 L 30 73 Z" fill="#92400E" opacity="0.8" />
      <path d="M 87 65 L 84 75 L 90 73 Z" fill="#92400E" opacity="0.8" />
      
      <!-- Subtle manuscript line embossed on ribbon -->
      <line x1="42" y1="70" x2="78" y2="70" stroke="#78350F" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />
    </g>

    <!-- Inner Triangular Quill / Illuminator Nib -->
    <polygon points="60,37 67,58 53,58" fill="#4338CA" opacity="0.7" />
    <line x1="60" y1="37" x2="60" y2="52" stroke="url(#goldCapGrad)" stroke-width="1.2" opacity="0.8" />
  </g>

  <!-- 3. Sparkling Excellence Star at Top-Right -->
  <g transform="translate(86, 15)">
    <path d="M 6 0 Q 6 6 12 6 Q 6 6 6 12 Q 6 6 0 6 Q 6 6 6 0 Z" fill="url(#goldCapGrad)" />
  </g>
</svg>
