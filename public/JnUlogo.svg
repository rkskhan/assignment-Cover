<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550">
  <defs>
    <!-- Curve for the ribbon text -->
    <path id="text-curve" d="M 90 480 Q 250 560 410 480" fill="none"/>
  </defs>

  <!-- 1. SHIELD -->
  <path d="M 95 15 L 405 15 L 405 240 C 405 375 250 440 250 440 C 250 440 95 375 95 240 Z"
        fill="#ffffff" stroke="#1d3587" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Horizontal divider -->
  <line x1="95" y1="240" x2="405" y2="240" stroke="#1d3587" stroke-width="6"/>

  <!-- Vertical divider (top half) -->
  <line x1="250" y1="15" x2="250" y2="240" stroke="#1d3587" stroke-width="6"/>

  <!-- 2. TOP-LEFT: ATOM SYMBOL -->
  <g transform="translate(172, 128)">
    <!-- Central nucleus -->
    <circle cx="0" cy="0" r="8" fill="#e11d48"/>
    
    <!-- Orbit 1 (Horizontal) -->
    <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="#e11d48" stroke-width="4.5"/>
    
    <!-- Orbit 2 (Rotated 60 deg) -->
    <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="#e11d48" stroke-width="4.5" transform="rotate(60)"/>
    
    <!-- Orbit 3 (Rotated -60 deg) -->
    <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="#e11d48" stroke-width="4.5" transform="rotate(-60)"/>
    
    <!-- Electrons (Red dots on orbits) -->
    <circle cx="-68" cy="0" r="6" fill="#e11d48"/>
    <circle cx="56" cy="-14" r="6" fill="#e11d48"/>
    <circle cx="-32" cy="56" r="6" fill="#e11d48"/>
  </g>

  <!-- 3. TOP-RIGHT: GEAR / COGWHEEL -->
  <g transform="translate(328, 128)">
    <!-- 8 Cog teeth -->
    <!-- Top & Bottom -->
    <rect x="-12" y="-66" width="24" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="5"/>
    <rect x="-12" y="46" width="24" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="5"/>
    <!-- Left & Right -->
    <rect x="-66" y="-12" width="20" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="5"/>
    <rect x="46" y="-12" width="20" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="5"/>
    <!-- Diagonals -->
    <rect x="-12" y="-66" width="24" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="5" transform="rotate(45)"/>
    <rect x="-12" y="46" width="24" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="5" transform="rotate(45)"/>
    <rect x="-66" y="-12" width="20" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="5" transform="rotate(45)"/>
    <rect x="46" y="-12" width="20" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="5" transform="rotate(45)"/>

    <!-- Outer gear circle -->
    <circle cx="0" cy="0" r="48" fill="#ffffff" stroke="#000000" stroke-width="5"/>
    <!-- Inner concentric circle / hub -->
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  </g>

  <!-- 4. BOTTOM HALF: OPEN BOOK -->
  <g transform="translate(250, 335)">
    <!-- Book 3D Base / Pages block -->
    <path d="M -75 52 L -70 65 L 0 82 L 70 65 L 75 52 L 0 68 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <path d="M -70 65 L -70 78 L 0 95 L 70 78 L 70 65" fill="#ffffff" stroke="#000000" stroke-width="3"/>

    <!-- Left Page Outline -->
    <path d="M 0 -62 C -25 -72 -58 -65 -72 -54 L -75 52 C -60 42 -25 46 0 58 Z"
          fill="#ffffff" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Right Page Outline -->
    <path d="M 0 -62 C 25 -72 58 -65 72 -54 L 75 52 C 60 42 25 46 0 58 Z"
          fill="#ffffff" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Center Spine Line -->
    <line x1="0" y1="-62" x2="0" y2="58" stroke="#000000" stroke-width="3"/>

    <!-- Left Page Bengali Text (শিক্ষা / ঈমান / শৃঙ্খলা) -->
    <g transform="translate(-36, -30)" text-anchor="middle" font-family="'Noto Serif Bengali', 'Times New Roman', serif" font-weight="bold" fill="#000000">
      <text x="0" y="0" font-size="14" letter-spacing="1">শিক্ষা</text>
      <text x="0" y="22" font-size="14" letter-spacing="1">ঈমান</text>
      <text x="0" y="44" font-size="13" letter-spacing="0.5">শৃঙ্খলা</text>
    </g>

    <!-- Right Page Decorative Wavy Text Lines -->
    <g stroke="#000000" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M 16 -30 Q 24 -33 32 -30 T 48 -30 T 60 -30"/>
      <path d="M 16 -12 Q 24 -15 32 -12 T 48 -12 T 60 -12"/>
      <path d="M 16 6 Q 24 3 32 6 T 48 6 T 60 6"/>
      <path d="M 16 24 Q 24 21 32 24 T 48 24 T 60 24"/>
    </g>
  </g>

  <!-- 5. BOTTOM RIBBON / BANNER -->
  <!-- Left Ribbon Tail / Fold -->
  <path d="M 5 435 L 75 410 L 80 470 L 10 500 L 35 467 Z" fill="#713f12" stroke="#522b0a" stroke-width="3"/>
  <path d="M 50 418 L 80 470 L 80 445 Z" fill="#451a03"/>

  <!-- Right Ribbon Tail / Fold -->
  <path d="M 495 435 L 425 410 L 420 470 L 490 500 L 465 467 Z" fill="#713f12" stroke="#522b0a" stroke-width="3"/>
  <path d="M 450 418 L 420 470 L 420 445 Z" fill="#451a03"/>

  <!-- Main Banner Arc -->
  <path d="M 75 410 C 180 470 320 470 425 410 L 420 475 C 320 545 180 545 80 475 Z"
        fill="#8d491a" stroke="#ca8a04" stroke-width="4.5"/>
  
  <!-- Banner Top & Bottom Gold Accent Lines -->
  <path d="M 75 410 C 180 470 320 470 425 410" fill="none" stroke="#eab308" stroke-width="2.5"/>
  <path d="M 80 475 C 180 545 320 545 420 475" fill="none" stroke="#eab308" stroke-width="2.5"/>

  <!-- Banner Text: জগন্নাথ বিশ্ববিদ্যালয় -->
  <text font-family="'Noto Serif Bengali', 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#ffffff">
    <textPath href="#text-curve" startOffset="50%" text-anchor="middle">
      জগন্নাথ বিশ্ববিদ্যালয়
    </textPath>
  </text>
</svg>
